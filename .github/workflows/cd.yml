name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 10
    environment: production

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          password: ${{ secrets.PROD_PASSWORD }}
          port: ${{ secrets.PROD_PORT }}
          script_stop: true
          script: |
            cd /root/.openclaw/workspace/orbit-core
            bash deploy.sh

      - name: Notify success
        if: success()
        run: echo "::notice::Deploy to production completed successfully"

      - name: Notify failure
        if: failure()
        run: echo "::error::Deploy to production FAILED — check server logs"
